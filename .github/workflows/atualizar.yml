name: Atualizar notícias

on:
  schedule:
    - cron: "17 * * * *"     # de hora em hora
  workflow_dispatch:          # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # sempre a versão mais nova do site (mesmo num "Re-run" de rodada antiga)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Identidade do robô no git
        run: |
          git config user.name "Central Robótica (robô)"
          git config user.email "actions@users.noreply.github.com"
      - name: Coletar e publicar (gerenciador automático)
        run: |
          python coletor/gerenciador.py
          tail -60 logs/*.log
